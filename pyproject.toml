[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "router-expert-slm"
version = "0.1.0"
description = "Router-expert system on Gemma-3-270M with a FastAPI serving layer."
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.4.0",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "transformers>=4.55.4",
    "accelerate>=1.10.0",
    "nltk>=3.8.1",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]
bench = ["httpx>=0.27.0"]
ablations = ["scikit-optimize>=0.10.0", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]
